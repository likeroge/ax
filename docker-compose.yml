# version: "3.8"

services:
  backend:
    # stdin_open: true # docker run -i
    # tty: true # docker run -t
    build:
      context: .
      # target: final # используем финальный stage из многоступенчатой сборки
    ports:
      - "3000:3000"
    # environment:
    #   - APP_ENV=production
    #   - PORT=5000
    # restart: unless-stopped
    volumes:
      - ./src:/app/src:ro
      - ./templates:/app/templates
      - ./static:/app/static
      # Монтируем Cargo.toml и Cargo.lock
      - ./Cargo.toml:/app/Cargo.toml:ro
      - ./Cargo.lock:/app/Cargo.lock:ro
      # - ./templates:/app/static
    networks:
      - app-network
  # frontend:
  #   volumes:
  #     - ./frontend:/app
  #     # - frontend-node-modules:/app/node_modules
  #   depends_on:
  #     - backend
  #   restart: unless-stopped
  #   build:
  #     context: ./frontend
  #   networks:
  #     - app-network
  nginx:
    build:
      context: ./nginx
    ports:
      - "80:80"
      - "443:443"
    # volumes:
    # - ./frontend/dist:/usr/share/nginx/html
    # depends_on:
    #   - frontend
    #   - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
